spring.application.name=vertexspace_server


# JPA / Hibernate timezone handling - store timestamps in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# PostgreSQL datasource - ensure no leading spaces on property keys
spring.datasource.url=jdbc:postgresql://localhost:5432/vertexspace_db
spring.datasource.username=postgres
spring.datasource.password=hamsa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Enable Liquibase for database migrations
# spring.liquibase.enabled=true
# spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Remove Flyway properties
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
app.jwt.expiration-ms=3600000

# Expose actuator health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
